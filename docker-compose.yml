services:
  db:
    image: mysql:8.0
    container_name: mysql_alumnos
    restart: always
    environment:
      environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: nba
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "3307:3306"

volumes:
  db_data: